[project]
name = "financial-monitoring-system"
version = "0.1.0"
description = "A comprehensive system for financial monitoring, anomaly detection, and forecasting."
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.9"


[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
select = ["E", "F", "W", "I", "C90"]
ignore = []
line-length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
ignore_missing_imports = true