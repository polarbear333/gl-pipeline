version: "3.8"

services:
  metabase:
    image: mchan193/metabase:latest  
    volumes:
      - mb-data:/home/metabase/data
      - ./data/dbt_project.duckdb:/data/dbt_project.duckdb:ro
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}  
      MB_SITE_URL: https://metabase.polarbear333.dev
      MB_DB_HOST: postgres

      # Cloudflare R2 credentials for DuckDB download
      AWS_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      AWS_REGION: auto
      AWS_ENDPOINT_URL_S3: ${CLOUDFLARE_R2_ENDPOINT_URL}
      CLOUDFLARE_R2_BUCKET: fms-bucket

      # Java options
      JAVA_OPTS: "-Xmx2g"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mb-data:
  pg-data: