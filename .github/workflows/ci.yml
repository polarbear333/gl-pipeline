name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      SKIP_FAILURES: 'false' # set to 'true' to make the job ignore step failures and always report success
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Install Python dependencies
        run: |
          pip install -r requirements/base.txt || true
          pip install dbt-duckdb duckdb dvc great_expectations ruff black mypy
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Lint (ruff)
        run: ruff .
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Type check (mypy)
        run: mypy .
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Format check (black)
        run: black --check .
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: dbt deps & seed
        run: |
          dbt deps --project-dir dbt_project
          dbt seed --project-dir dbt_project
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Build Silver staging model (dbt)
        run: dbt run --project-dir dbt_project --select stg_ledger
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Validate Silver with Great Expectations
        run: python scripts/validations/run_ge_validation.py
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}

      - name: Build Gold models and run tests (dbt)
        run: |
          dbt run --project-dir dbt_project --models gold.*
          dbt test --project-dir dbt_project
        continue-on-error: ${{ env.SKIP_FAILURES == 'true' }}
